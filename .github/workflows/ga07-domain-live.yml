name: GA-07 Formal Domain Knowledge Capability Live E2E

on:
  pull_request:
    paths:
      - "agent_core/domain_knowledge.py"
      - "agent_core/knowledge_model_transport.py"
      - "agent_core/chat_transport.py"
      - "tests/test_ga07_live_domain_capability_e2e.py"
      - ".github/workflows/ga07-domain-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ga07-qwen:
    name: GA-07 formal domain knowledge + Qwen2.5 3B
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Start loopback real model
        shell: bash
        run: |
          set -euo pipefail
          echo "GA07_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
          docker run -d --name ga07-qwen --cpus=2 --memory=5g -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          docker exec ga07-qwen ollama pull qwen2.5:3b
          docker exec ga07-qwen sha256sum /root/.ollama/models/manifests/registry.ollama.ai/library/qwen2.5/3b
      - name: Execute six real knowledge-port Agent tasks
        env:
          GA07_LIVE_OPT_IN: "1"
          GA01C_LLM_URL: http://127.0.0.1:11434/v1/chat/completions
          GA01C_LLM_MODEL: qwen2.5:3b
        run: python -m pytest tests/test_ga07_live_domain_capability_e2e.py -q -s -rs
      - name: Diagnostics on failure
        if: failure()
        run: docker logs --tail 60 ga07-qwen || true
      - name: Stop model
        if: always()
        run: docker rm -f ga07-qwen || true
