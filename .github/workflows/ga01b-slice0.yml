name: Agent Runtime Test Gates

on:
  push:
    branches:
      - main
      - feature/ga-01b-slice0-20261010
  pull_request:
    paths:
      - "runtime/**"
      - "agent_core/**"
      - "tests/**"
      - ".github/workflows/ga01b-slice0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime, pytest, mypy, ruff
        run: |
          python -m pip install -e '.[test]' mypy ruff
      - name: Targeted G01 G02 G03 regression
        run: |
          python -m pytest tests/test_m2_runtime_integration_gate.py tests/test_m6_iu1_b2_dual_runtime.py tests/test_ga01_slice0.py tests/test_ga01_slice0_integration.py tests/test_ga01_slice0_security.py tests/test_ga01_slice1.py tests/test_ga01_slice2.py -q
      - name: Full pytest
        if: success() || failure()
        run: python -m pytest tests -q
      - name: Mypy
        if: success() || failure()
        run: python -m mypy runtime agent_core tests
      - name: Ruff lint
        if: success() || failure()
        run: python -m ruff check runtime agent_core tests
      - name: Ruff formatting
        if: success() || failure()
        run: python -m ruff format --check runtime agent_core tests
