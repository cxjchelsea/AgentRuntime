name: CA-M5-IU9-03 formatted exact-head verification
on:
  push:
    branches:
      - verification/ca-m5-iu9-03-9bc9a22
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9bc9a226489189c2fbeb6f93642a7ba826de1227
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.0,<3" "pytest>=8.0" mypy ruff
      - run: python -m pytest tests -q
      - run: python -m mypy runtime tests
      - run: python -m ruff check runtime tests
      - run: python -m ruff format --check runtime tests
