name: Agent Runtime Test Gates

on:
  push:
    branches:
      - main
      - feature/ga-01b-slice0-20261010
  pull_request:
    paths:
      - "runtime/**"
      - "agent_core/**"
      - "tests/**"
      - ".github/workflows/ga01b-slice0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime, pytest, mypy, ruff
        run: |
          python -m pip install -e '.[test]' mypy ruff
      - name: Targeted G01 G02 G03 regression
        run: |
          python -m pytest tests/test_m2_runtime_integration_gate.py tests/test_m6_iu1_b2_dual_runtime.py tests/test_ga01_slice0.py tests/test_ga01_slice0_integration.py tests/test_ga01_slice0_security.py tests/test_ga01_slice1.py tests/test_ga01_slice2.py tests/test_ga01_slice2_m4.py tests/test_ga01_slice2_loop.py tests/test_ga01c_transport.py tests/test_ga01c_live.py tests/test_ga01c_http_e2e.py -q
      - name: Full pytest
        if: success() || failure()
        run: python -m pytest tests -q
      - name: Optional live LLM sandbox
        if: success() || failure()
        env:
          GA01C_LIVE_OPT_IN: ${{ vars.GA01C_LIVE_OPT_IN }}
          GA01C_LLM_API_KEY: ${{ secrets.GA01C_LLM_API_KEY }}
          GA01C_LLM_URL: ${{ vars.GA01C_LLM_URL || 'https://api.deepseek.com/chat/completions' }}
          GA01C_LLM_MODEL: ${{ vars.GA01C_LLM_MODEL || 'deepseek-flash' }}
        run: python -m pytest tests/test_ga01c_live.py -q -rs
      - name: Mypy
        if: success() || failure()
        run: python -m mypy runtime agent_core tests
      - name: Ruff lint
        if: success() || failure()
        run: python -m ruff check runtime agent_core tests
      - name: Ruff formatting
        if: success() || failure()
        run: python -m ruff format --check runtime agent_core tests

  free-local-model:
    name: Free local Qwen2.5 3B real inference
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/ga-01c-real-model-adapter-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install -e '.[test]'
      - name: Start keyless CPU model server
        run: |
          docker run -d --name ga01c-qwen --cpus=2 --memory=5g -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          docker exec ga01c-qwen ollama pull qwen2.5:3b
      - name: Actual Qwen2.5 inference smoke
        env:
          GA01C_LLM_URL: http://127.0.0.1:11434/v1/chat/completions
          GA01C_LLM_MODEL: qwen2.5:3b
        run: |
          python -m pytest tests/test_ga01c_free_local.py -q -rs
      - name: Real model inside bounded Agent Loop
        env:
          GA01C_LIVE_OPT_IN: '1'
          GA01C_LLM_URL: http://127.0.0.1:11434/v1/chat/completions
          GA01C_LLM_MODEL: qwen2.5:3b
          GA01C_LLM_API_KEY: ''
        run: |
          python -m pytest tests/test_ga01c_live.py::test_live_provider_drives_two_approved_mock_actions -q -rs
      - name: No-answer-leak real Qwen decision evaluation
        env:
          GA01C_EVAL_OPT_IN: '1'
          GA01C_LLM_URL: http://127.0.0.1:11434/v1/chat/completions
          GA01C_LLM_MODEL: qwen2.5:3b
        run: |
          python -m pytest tests/test_ga01c_decision_eval.py::test_real_qwen_semantic_decisions_no_answer_leak -q -s -rs
      - name: Report local server logs on failure
        if: failure()
        run: docker logs --tail 70 ga01c-qwen || true
      - name: Remove CPU server
        if: always()
        run: docker rm -f ga01c-qwen || true
