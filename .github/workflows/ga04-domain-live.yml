name: GA-04 Domain-Aware Real Model E2E

on:
  pull_request:
    paths:
      - "tests/ga04_domain_real_transport.py"
      - "tests/test_ga04_domain_real_model_eval.py"
      - ".github/workflows/ga04-domain-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-qwen:
    name: GA-04 Qwen2.5 3B two-domain evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sandbox test dependencies
        run: python -m pip install -e '.[test]'
      - name: Start isolated loopback Ollama and pin evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "GA04_GITHUB_SHA=$GITHUB_SHA"
          echo "GA04_PR_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
          docker run -d --name ga04-domain-qwen --cpus=2 --memory=5g -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          docker exec ga04-domain-qwen ollama pull qwen2.5:3b
          docker exec ga04-domain-qwen sha256sum /root/.ollama/models/manifests/registry.ollama.ai/library/qwen2.5/3b
          docker image inspect ollama/ollama:latest --format 'OLLAMA_IMAGE_ID={{.Id}}'
      - name: Real LLM chooses both domains through existing M4
        env:
          GA04_LIVE_OPT_IN: "1"
          GA01C_LLM_URL: http://127.0.0.1:11434/v1/chat/completions
          GA01C_LLM_MODEL: qwen2.5:3b
        run: python -m pytest tests/test_ga04_domain_real_model_eval.py -q -s -rs
      - name: Diagnostics on failure
        if: failure()
        run: docker logs --tail 100 ga04-domain-qwen || true
      - name: Remove isolated model server
        if: always()
        run: docker rm -f ga04-domain-qwen || true
