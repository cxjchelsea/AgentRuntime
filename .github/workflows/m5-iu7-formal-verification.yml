name: M5-IU7 Formal verification
on:
  push:
    branches:
      - verification/m5-iu7-formal-b0992a9
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b0992a931cac68439bb8e6d2cec99c7ad06e321b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.0,<3" "pytest>=8.0" mypy ruff
      - name: pytest
        run: python -m pytest tests -q
      - name: mypy
        run: python -m mypy runtime tests
      - name: ruff check
        run: python -m ruff check runtime tests
      - name: ruff format check
        run: python -m ruff format --check runtime tests
