name: CA-M5-IU9-04 Verification

on:
  push:
    branches:
      - verification/ca-m5-iu9-04-**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" mypy ruff
      - name: Pytest
        run: python -m pytest tests -q
      - name: Mypy
        run: python -m mypy runtime tests
      - name: Ruff check
        run: python -m ruff check runtime tests
      - name: Ruff format check
        run: python -m ruff format --check runtime tests
