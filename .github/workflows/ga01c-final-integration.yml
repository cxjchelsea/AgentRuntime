name: GA-01C Final Integration Gate

on:
  pull_request:
    paths:
      - "runtime/**"
      - "agent_core/**"
      - "tests/**"
      - ".github/workflows/ga01c-final-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-standard:
    name: GA-01C integration standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gate dependencies
        run: python -m pip install -e '.[test]' mypy ruff
      - name: Full pytest (historical opt-in diagnostics retain their original tests)
        run: python -m pytest tests -q
      - name: GA-19 offline cross-scenario scorecard
        run: python tests/ga19_evaluate.py --tier offline --out-dir ga19-reports
      - name: Upload GA-19 offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga19-offline-${{ github.run_id }}
          path: ga19-reports/
          if-no-files-found: warn
      - name: Mypy
        run: python -m mypy runtime agent_core tests
      - name: Ruff lint
        run: python -m ruff check runtime agent_core tests
      - name: Ruff format
        run: python -m ruff format --check runtime agent_core tests

  integration-qwen:
    name: GA-01C final Qwen2.5 3B live E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install -e '.[test]'
      - name: Start isolated Ollama and record pinned evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "CHECKOUT_SHA=${GITHUB_SHA}"
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "GIT_REF=${GITHUB_REF}"
          docker run -d --name ga01c-integration-qwen --cpus=2 --memory=5g -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          docker exec ga01c-integration-qwen ollama pull qwen2.5:3b
          docker exec ga01c-integration-qwen ollama list
          docker exec ga01c-integration-qwen sha256sum /root/.ollama/models/manifests/registry.ollama.ai/library/qwen2.5/3b
          docker image inspect ollama/ollama:latest --format 'OLLAMA_IMAGE_ID={{.Id}}'
      - name: Real model smoke and Agent Loop
        env:
          GA01C_LIVE_OPT_IN: "1"
          GA01C_LLM_URL: http://127.0.0.1:11434/v1/chat/completions
          GA01C_LLM_MODEL: qwen2.5:3b
          GA01C_LLM_API_KEY: ""
        run: |
          python -m pytest tests/test_ga01c_free_local.py -q -rs
          python -m pytest tests/test_ga01c_live.py::test_live_provider_drives_two_approved_mock_actions -q -rs
          python -m pytest tests/test_ga01c_decision_eval.py::test_real_qwen_semantic_decisions_no_answer_leak -q -s -rs
          GA15_LIVE_OPT_IN=1 python -m pytest tests/test_ga15_live_business_agent.py -q -s -rs
          GA16_LIVE_OPT_IN=1 python -m pytest tests/test_ga16_dynamic_business_task.py -q -s -rs
          GA17_LIVE_OPT_IN=1 python -m pytest tests/test_ga17_goal_driven_plan.py -q -s -rs
          GA18_LIVE_OPT_IN=1 python -m pytest tests/test_ga18_adaptive_goal.py -q -s -rs
          GA15_LIVE_OPT_IN=1 GA16_LIVE_OPT_IN=1 GA17_LIVE_OPT_IN=1 GA18_LIVE_OPT_IN=1 python tests/ga19_evaluate.py --tier live --out-dir ga19-reports
          python -m tests.ga20_fixture_prepare --output-dir /tmp/ga20-business-fixtures
          python -m examples.ga20_sandbox_cli --operator-config /tmp/ga20-business-fixtures/inventory.json --domain inventory --question '请查询库存并计算需要补货多少件'
          python -m examples.ga20_sandbox_cli --operator-config /tmp/ga20-business-fixtures/learning.json --domain learning --question '请查询学习进度与剩余学习任务'
          # GA-21: first turn uses real model/tool, second recalls verified
          # evidence with no re-execution; cancellation closes the session.
          printf '请查询库存\\n刚才结果\\n取消\\n' | python -m examples.ga21_cli --domain inventory --operator-config /tmp/ga20-business-fixtures/inventory.json | tee /tmp/ga21-live-session.log
          grep -q '没有重新读取数据' /tmp/ga21-live-session.log
          grep -q '当前会话任务已结束' /tmp/ga21-live-session.log
      - name: Repeat final DIAG-03 E2E three independent executions
        shell: bash
        env:
          GA01C_DIAG03_OPT_IN: "1"
          GA01C_INVALID_CHOICE_RETRY_OPT_IN: "1"
          GA01C_LLM_URL: http://127.0.0.1:11434/v1/chat/completions
          GA01C_LLM_MODEL: qwen2.5:3b
        run: |
          set -uo pipefail
          failed=0
          for repeat in 1 2 3; do
            echo "::group::DIAG03 independent trial ${repeat}/3"
            if python -m pytest tests/test_ga01c_diag03.py::test_diag03_real_model_typed_multitask_e2e -q -s -rs; then
              status=0
            else
              status=$?
            fi
            echo "DIAG03_TRIAL=${repeat} STATUS=${status}"
            if [ "$status" -ne 0 ]; then failed=1; fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Upload GA-19 real-model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga19-live-${{ github.run_id }}
          path: ga19-reports/
          if-no-files-found: warn
      - name: Report Ollama logs on failure
        if: failure()
        run: docker logs --tail 100 ga01c-integration-qwen || true
      - name: Remove isolated Ollama
        if: always()
        run: docker rm -f ga01c-integration-qwen || true
