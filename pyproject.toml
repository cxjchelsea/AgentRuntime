[project]
name = "agent-runtime"
version = "0.1.0"
description = "Reusable Agent Runtime Core Contracts (M0-IU1)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["runtime*", "agent_core*"]
exclude = ["tests*", "docs*", "可复用Agent_Runtime平台设计*"]
