name: M5-IU7 Formal preflight
on:
  push:
    branches:
      - verification/m5-iu7-formal-preflight-3d57fc9
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d57fc9418d979503db78570b3163f972be19826
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.0,<3" "pytest>=8.0" mypy ruff
      - run: python -m pytest tests -q
      - run: python -m mypy runtime tests
      - run: python -m ruff check runtime tests
      - run: python -m ruff format --check runtime tests
