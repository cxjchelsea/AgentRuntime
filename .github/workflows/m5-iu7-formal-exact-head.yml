name: M5-IU7 Formal exact-head verification
on:
  push:
    branches:
      - verification/m5-iu7-formal-a0b81a6
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0b81a6f1ed51f334f7d374622fcd64719bc78a4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.0,<3" "pytest>=8.0" mypy ruff
      - name: pytest
        run: python -m pytest tests -q
      - name: mypy
        run: python -m mypy runtime tests
      - name: ruff check
        run: python -m ruff check runtime tests
      - name: ruff format check
        run: python -m ruff format --check runtime tests
